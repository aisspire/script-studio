[package]
name = "script-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
axum = "=0.8.8"
tokio = { version = "=1.49.0", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.23.0", features = ["v4", "serde"] }
fs2 = "=0.4.3"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.183"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_Globalization", "Win32_Storage_FileSystem"] }
